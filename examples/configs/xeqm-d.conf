# xeqm-d.conf — example daemon config
# Usage: xeqm-d --config-file /etc/xeqm/xeqm-d.conf

data-dir=/var/lib/xeqm
log-file=/var/log/xeqm/daemon.log
log-level=1

# Admin / client RPC — keep on loopback unless you intend a public RPC node.
rpc-bind-ip=127.0.0.1
rpc-bind-port=9231
confirm-external-bind=1

# P2P (chain sync) — must be reachable from the internet.
p2p-bind-ip=0.0.0.0
p2p-bind-port=9230

out-peers=64
in-peers=32

non-interactive=1
